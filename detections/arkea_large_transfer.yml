title: Potential Bank Internal Fund Exfiltration (Arkea Pattern)
id: 8f3a2c1e-2026-4b1d-9c7e-arkea0001
status: experimental
description: Detects internal operational account transferring high value to crypto exchange on-ramp.
logsource:
  category: banking_transaction
detection:
  selection:
    source_account_type: "INTERNAL_OPERATIONAL"
    destination_institution_type: "CRYPTO_EXCHANGE"
  amount:
    amount_eur: '> 1000000'
  condition: selection and amount
level: critical
falsepositives:
  - Scheduled treasury rebalancing (pre-approved)
tags:
  - attack.exfiltration
  - attack.t1567
