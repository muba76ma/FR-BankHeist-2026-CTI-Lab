title: FICOBA Credential Abuse - Mass Query
id: 8f3a2c1e-2026-4b1d-9c7e-ficoba001
status: experimental
description: Alerts when a single account queries an unusually high number of FICOBA records in a short window.
logsource:
  product: ficoba
  category: database_access
detection:
  selection:
    action: "SELECT"
    table: "ficoba_accounts"
  timeframe: 5m
  condition: selection | count() by user > 1000
level: high
tags:
  - attack.collection
  - attack.t1213
